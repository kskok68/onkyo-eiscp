description: amplifier Operation Command
name: amplifier
values:
  AMTOFF:
    description: sets Audio Muting On
    models: []
    name: audio-muting-on
  AMTON:
    description: sets Audio Muting Off
    models: []
    name: audio-muting-off
  AMTTG:
    description: sets Audio Muting On/Off(toggle)
    models: []
    name:
    - audio-muting-on
    - 'off'
  MVLDOWN:
    description: sets Volume Level Down
    models: []
    name: volume-down
  MVLUP:
    description: sets Volume Level Up
    models: []
    name: volume-up
  PWROFF:
    description: sets System Standby
    models: []
    name: system-standby
  PWRON:
    description: sets System On
    models: []
    name: system-on
  PWRTG:
    description: sets System On/Standby(toggle)
    models: []
    name:
    - system-on
    - standby
  SLIDOWN:
    description: sets Selector Position Wrap-Around Down
    models: []
    name: slidown
  SLIUP:
    description: sets Selector Position Wrap-Around Up
    models: []
    name: sliup
