description: '[e-onkyo] Device Authentication Key'
name: e-onkyo-device-authentication-key
values:
  Ezz:
    description: "Device Authentication Key Error\nzz : Error Code\n\u201D05\u201D\
      \ : Device Authentication Key Error"
    models: []
    name: ezz
  NOT:
    description: Not setting
    models: []
    name: not
  QSTN:
    description: Get status of setting Device Authentication Key (return "CMP" or
      "NOT")
    models: []
    name: query
  S{xx}{xx}{xx}{xx}:
    description: Set Device Authentication Key(8 ASCII letters) (return "CMP" or "Ezz")
    models: []
    name: s-xx-xx-xx-xx
  "\u201DCMP\u201D":
    description: Device Authentication Key was set
    models: []
    name: cmp
