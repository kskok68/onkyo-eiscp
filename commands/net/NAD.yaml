description: NET Alexa Device Information (for Network Control Only)
name: alexa-device-information
values:
  QSTN:
    description: gets Device Information for Alexa service
    models: &id001
    - DRC-R1.3
    - DRX-3.3
    - DRX-3.4
    - DRX-4.3
    - DRX-5.3
    - DRX-5.4
    - DRX-7.3
    - DRX-R1.3
    - TX-8390
    - TX-NR5100
    - TX-NR6050
    - TX-NR6100
    - TX-NR696
    - TX-NR7100
    - TX-NR797
    - TX-RZ3400
    - TX-RZ50
    - TX-RZ740
    - TX-RZ840
    name: query
  '{xx}x...{xx}x/yyy...yyy':
    description: 'NET/USB Device Information for Alexa service

      xxx...xxx : Character of locale code for Alexa service (variable-length, Unicode
      letters [UTF-8 encoded])

      yyy...yyy : Character of device name for Alexa service (variable-length, Unicode
      letters [UTF-8 encoded])'
    models: *id001
    name: xx-x-xx-x-yyy-yyy
