description: Airplay Play Status (Airplay Model Only)
name: airplay-play-status
values:
  QSTN:
    description: gets the Net/USB Status
    models: &id001
    - DHC-40.1
    - DHC-40.2
    - DHC-80.1
    - DHC-80.2
    - DTR-40.1
    - DTR-40.2
    - DTR-50.1
    - DTR-50.2
    - DTR-70.1
    - DTR-70.2
    - DTR-80.1
    - DTR-80.2
    - PR-SC5507
    - TX-NR1007
    - TX-NR1008
    - TX-NR3007
    - TX-NR3008
    - TX-NR5007
    - TX-NR5008
    - TX-NR515
    - TX-NR515AE
    - TX-NR616
    - TX-NR616AE
    - TX-NR708
    - TX-NR807
    - TX-NR808
    - TX-NR818
    - TX-NR818AE
    name: query
  prs:
    description: 'NET/USB Play Status (3 letters)

      p -> Play Status: "S": STOP, "P": Play, "p": Pause

      r -> Repeat Status: "-": Off

      s -> Shuffle Status: "-": Off'
    models: *id001
    name: prs
