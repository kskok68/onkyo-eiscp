description: NET/USB File Format Information
name: usb-file-format-information
values:
  QSTN:
    description: gets NET/USB File Info
    models:
    - TX-8470
    name: query
  '{xx}...{xx}/yy...yy/zz...zz':
    description: "NET/USB File Info (variable-length, 64 ASCII letters max)\nxx...xx\uFF1A\
      format(filename extension)(UTF-8)\nyy...yy\uFF1Asampling frequency(uncompressed)\
      \ or bitrate(compressed)(UTF-8)\nzz...zz\uFF1Aquantization bit rate(UTF-8)\n\
      note: Separate each parameter with '/' and do not omit '/' even if there is\
      \ no information"
    models: []
    name: xx-xx-yy-yy-zz-zz
