  maabbstii:
    description: "NET/USB Menu Status (9 letters)\nm -> Track Menu: \"M\": Menu is\
      \ enable, \"x\": Menu is disable\naa -> F1 button icon (Positive Feed or Mark/Unmark)\n\
      bb -> F2 button icon (Negative Feed)\n aa or bb : \"xx\":disable, \"01\":Like,\
      \ \"02\":don't like, \"03\":Love, \"04\":Ban,\n                  \"05\":episode,\
      \ \"06\":ratings, \"07\":Ban(black), \"08\":Ban(white),\n                  \"\
      09\":Favorite(black), \"0A\":Favorite(white), \"0B\":Favorite(yellow)\ns ->\
      \ Time Seek \"S\": Time Seek is enable \"x\": Time Seek is disable\nt -> Time\
      \ Display \"1\": Elapsed Time/Total Time, \"2\": Elapsed Time, \"x\": disable\n\
      ii-> Service icon\n ii : \"00\":Music Server (DLNA), \"01\":My Favorite, \"\
      02\":vTuner, \n      \"03\":SiriusXM, \"04\":Pandora,\n      \"05\":Rhapsody,\
      \ \"06\":Last.fm, \"07\":Napster, \"08\":Slacker, \"09\":Mediafly,\n      \"\
      0A\":Spotify, \"0B\":AUPEO!,\n      \"0C\":radiko, \"0D\":e-onkyo, \"0E\":TuneIn,\
      \ \"0F\":MP3tunes, \"10\":Simfy,\n      \"11\":Home Media, \"12\":Deezer, \"\
      13\":iHeartRadio, \"18\":Airplay,\n      \u201C1A\u201D: onkyo Music, \u201C\
      1B\u201D:TIDAL, \"1C\":Amazon Music, \"1D\":PlayQueue,\n      \u201C40\u201D\
      :Chromecast built-in, \u201C41\u201D:FireConnect, \"42\":Play-Fi,\n      \"\
