description: NET Popup Message(for Network Control Only)
name: popup-message
values:
  xaaa...aaaybbb...bbb:
    description: "x -> Popup Display Type\n 'T': Popup text is top\n 'B': Popup text\
      \ is bottom\n 'L': Popup text is list format\n\naaa...aaa -> Popup Title, Massage\n\
      \ when x = 'T' or 'B'\n    Top Title [0x00] Popup Title [0x00] Popup Message\
      \ [0x00]\n    (variable-length Unicode letter [UTF-8 encoded] )\n\n when x =\
      \ 'L'\n    Top Title [0x00] Item Title 1 [0x00] Item Parameter 1 [0x00] ...\
      \ [0x00] Item Title 6 [0x00] Item Parameter 6 [0x00]\n    (variable-length Unicode\
      \ letter [UTF-8 encoded] )\n\ny -> Cursor Position on button\n '0' : Button\
      \ is not Displayed\n '1' : Cursor is on the button 1\n '2' : Cursor is on the\
      \ button 2\n\nbbb...bbb -> Text of Button\n    Text of Button 1 [0x00] Text\
      \ of Button 2 [0x00]\n    (variable-length Unicode letter [UTF-8 encoded] )"
