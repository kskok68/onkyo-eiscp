  tlpnnnnnnnnnn:
    description: "NET/USB List Info\nt ->Information Type (A : ASCII letter, C : Cursor\
      \ Info, U : Unicode letter)\nwhen t = A,\n  l ->Line Info (0-9 : 1st to 10th\
      \ Line)\n  nnnnnnnnn:Listed data (variable-length, 64 ASCII letters max)\n \
      \   when AVR is not displayed NET/USB List(Keyboard,Menu,Popup...), \"nnnnnnnnn\"\
      \ is \"See TV\".\n  p ->Property\n         - : no\n         0 : Playing, A :\
      \ Artist, B : Album, F : Folder, M : Music, P : Playlist, S : Search\n     \
      \    a : Account, b : Playlist-C, c : Starred, d : Unstarred, e : What's New\n\
      when t = C,\n  l ->Cursor Position (0-9 : 1st to 10th Line, - : No Cursor)\n\
      \  p ->Update Type (P : Page Information Update ( Page Clear or Disable List\
      \ Info) , C : Cursor Position Update)\nwhen t = U, (for Network Control Only)\n\
      \  l ->Line Info (0-9 : 1st to 10th Line)\n  nnnnnnnnn:Listed data (variable-length,\
      \ 64 Unicode letters [UTF-8 encoded] max)\n    when AVR is not displayed NET/USB\
      \ List(Keyboard,Menu,Popup...), \"nnnnnnnnn\" is \"See TV\".\n  p ->Property\n\
      \         - : no\n         0 : Playing, A : Artist, B : Album, F : Folder, M\
      \ : Music, P : Playlist, S : Search\n         a : Account, b : Playlist-C, c\
      \ : Starred, d : Unstarred, e : What's New"
    models: *id001
