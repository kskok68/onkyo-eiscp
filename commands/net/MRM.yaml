description: Multiroom Message Command (Message Command from the product to App.)
name: multiroom-message
values:
  ab:
    description: 'a:

      0 FireConnect cancellation with ZoneOn

      ZoneOff by FireConnectOn


      b:

      ''bit0 rsv (always LO)

      ''bit1 HI During Zone2On, FireConnectOn and Zone2Off

      ''bit2 HI During Zone2On, FireConnectOn and Zone3Off

      ''bit3 HI During Zone4On, FireConnectOn and Zone4Off

      bit0-4 = all LO During FireConnectOn, ZoneOn and FireConnect canceled


      ex.:MRM02 Zone 2 turned off

      ex.:MRM06 Zone2/Zone3 turned off

      ex.:MRM00 FireConnet canceled


      a:

      1 Chromecast canceled with ZoneOn

      ZoneOff by Chromecast connection

      b:

      bit0 rsv (always LO)

      bit1 HI During Zone2On, Chromecast connection and Zone2Off

      bit2 HI During Zone3On, Chromecast connection and Zone3Off

      bit3 HI During Zone4On, Chromecast connection and Zone4Off

      bit0-4 = all LO DuringChromecast, ZoneOn and Chromecast canceled


      ex.:MRM12 Zone2 turned off

      ex.:MRM16 Zone2/Zone3 turned off

      ex.:MRM10 Chromecast canceled'
