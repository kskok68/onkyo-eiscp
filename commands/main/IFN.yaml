description: Network Information Command
name: network-information
values:
  INFO:
    description: display Information of Network
    models: &id001
    - DRX-2.4
    - DRX-3.4
    - DRX-5.4
    - TX-NR5100
    - TX-NR6050
    - TX-NR6100
    - TX-NR7100
    - TX-RZ50
    name: info
  QSTN:
    description: gets Information of Network
    models: *id001
    name: query
  a..a,b..b,c...c:
    description: 'information of Network(Same Immediate Display '','' is separator
      of informations)

      a...a: MAC Address

      b...b: IP Address

      c...c: Host Name'
    models: *id001
    name: a-a-b-b-c-c
