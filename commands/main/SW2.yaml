description: Subwoofer 2 (temporary) Level Command
name: subwoofer-2-temporary-level
values:
  ? - -30
    - 24
  : description: sets Subwoofer 2 Level -15.0dB - 0.0dB - +12.0dB(0.5dB Step)
    models:
    - DRC-R1
    - DRC-R1.1
    - DRC-R1.3
    - DRX-7
    - DRX-7.1
    - DRX-7.3
    - DRX-R1
    - DRX-R1.1
    - DRX-R1.3
    - PR-RZ5100
    - TX-RZ1100
    - TX-RZ3100
    - TX-RZ3400
    - TX-RZ920
  ? - -15
    - 12
  : description: sets Subwoofer 2 Level -15dB - 0dB - +12dB
    models:
    - DHC-80.6
    - DTR-60.6
    - DTR-70.6
    - PR-SC5530
    - TX-NR1030
    - TX-NR3030
  UP:
    description: LEVEL + Key
    models: &id001
    - DHC-80.6
    - DRC-R1
    - DRC-R1.1
    - DRC-R1.3
    - DRX-7
    - DRX-7.1
    - DRX-7.3
    - DRX-R1
    - DRX-R1.1
    - DRX-R1.3
    - DTR-60.6
    - DTR-70.6
    - PR-RZ5100
    - PR-SC5530
    - TX-NR1030
    - TX-NR3030
    - TX-RZ1100
    - TX-RZ3100
    - TX-RZ3400
    - TX-RZ920
    name: up
  DOWN:
    description: LEVEL - KEY
    models: *id001
    name: down
  QSTN:
    description: gets the Subwoofer Level
    models: *id001
    name: query
