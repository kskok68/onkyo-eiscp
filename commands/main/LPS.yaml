description: Lip Sync / Auto Delay
name: lip-sync-auto-delay
values:
  '00':
    description: sets Lip Sync Off
    models: []
    name: 'off'
  '01':
    description: sets Lip Sync On
    models: []
    name: 'on'
  QSTN:
    description: gets The Lip Sync State
    models: []
    name: query
  UP:
    description: sets Lip Sync Wrap-Around
    models: []
    name: up
