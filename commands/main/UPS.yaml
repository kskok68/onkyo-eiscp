description: Upsampling
name: upsampling
values:
  '00':
    description: sets Upsampling x1
    models: &id001
    - DRC-R1.1
    - DRC-R1.3
    - DRX-7.1
    - DRX-7.3
    - DRX-8.4
    - DRX-R1.1
    - DRX-R1.3
    - TX-RZ3400
    - TX-RZ70
    name: x1
  '01':
    description: sets Upsampling x2
    models: *id001
    name: x2
  '02':
    description: sets Upsampling x4
    models: *id001
    name: x4
  '03':
    description: sets Upsampling x8
    models: []
    name: x8
  QSTN:
    description: gets The Upsampling State
    models: *id001
    name: query
  UP:
    description: sets Upsampling Wrap-Around
    models: *id001
    name: up
