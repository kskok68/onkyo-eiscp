description: HD Radio Tuner Status (HD Radio Model Only)
name: hd-radio-tuner-status
values:
  QSTN:
    description: gets the HD Radio Tuner Status
    models: &id001
    - DHC-9.9
    - DTC-9.8
    - DTR-70.4
    - DTR-8.8
    - DTR-8.9
    - DTR-9.9
    - DTX-8.8
    - DTX-8.9
    - DTX-9.9
    - PR-SC885
    - PR-SC886
    - TX-NA905
    - TX-NA906
    - TX-NA906X
    - TX-NR1010
    - TX-NR3010
    - TX-NR5010
    - TX-NR905
    - TX-NR906
    - TX-SA806X
    - TX-SA876
    - TX-SR876
    name: query
  mmnnoo:
    description: 'HD Radio Tuner Status (3 bytes)

      mm -> "00" not HD, "01" HD

      nn -> current Program "01"-"08"

      oo -> receivable Program (8 bits are represented in hexadecimal notation. Each
      bit shows receivable or not.)'
    models: *id001
    name: mmnnoo
