description: Vocal/Dialog Command
name: vocal-dialog
values:
  DOWN:
    description: sets Vocal/Dialog Level down(1 step)
    models: &id001
    - DRC-R1.3
    - DRX-2.3
    - DRX-2.4
    - DRX-3.3
    - DRX-3.4
    - DRX-4.3
    - DRX-5.3
    - DRX-5.4
    - DRX-7.3
    - DRX-R1.3
    - TX-8390
    - TX-NR5100
    - TX-NR595
    - TX-NR6050
    - TX-NR6100
    - TX-NR696
    - TX-NR7100
    - TX-NR797
    - TX-RZ3400
    - TX-RZ50
    - TX-RZ740
    - TX-RZ840
    name: down
  QSTN:
    description: gets Vocal/Dialogs Level
    models: *id001
    name: query
  UP:
    description: sets Vocal/Dialog Level up(1 step)
    models: *id001
    name: up
  "\u201C00\u201D-\u201C05\u201D":
    description: "sets Vocal/Dialog Level 0\uFF5E5"
    models: *id001
    name: 0-5
