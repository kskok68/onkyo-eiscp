description: Stereo Assign Mode Command
name: stereo-assign-mode
values:
  FR:
    description: sets Front Speaker
    models: &id001
    - DRC-R1.3
    - DRX-3.3
    - DRX-3.4
    - DRX-4.3
    - DRX-5.3
    - DRX-5.4
    - DRX-7.3
    - DRX-R1.3
    - TX-NR6050
    - TX-NR6100
    - TX-NR696
    - TX-NR7100
    - TX-NR797
    - TX-RZ3400
    - TX-RZ50
    - TX-RZ740
    - TX-RZ840
    name: front-speaker
  H1:
    description: sets Height1 Speakers
    models: *id001
    name: height1-speakers
  H2:
    description: sets Height2 Speakers
    models:
    - DRC-R1.3
    - DRX-3.3
    - DRX-3.4
    - DRX-4.3
    - DRX-5.3
    - DRX-5.4
    - DRX-7.3
    - DRX-R1.3
    - TX-NR7100
    - TX-NR797
    - TX-RZ3400
    - TX-RZ50
    - TX-RZ740
    - TX-RZ840
    name: height2-speakers
  QSTN:
    description: gets the Stereo Assign Mode
    models: *id001
    name: query
  SB:
    description: sets SurrBack Speaker
    models: *id001
    name: surrback-speaker
  SR:
    description: sets Surround Speaker
    models: *id001
    name: surround-speaker
  UP:
    description: sets Stereo Assign Mode Wrap-Around
    models: *id001
    name: up
