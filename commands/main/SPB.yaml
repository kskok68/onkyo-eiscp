description: Speaker A/B Command
name: speaker-b
values:
  '00':
    description: sets Speaker Off
    models: &id002
    - DTM-7
    - DTR-10.5
    - DTR-5.2
    - ETX-NA1000
    - RDC-7.1
    - TX-8270(Ether)
    - TX-8390
    - TX-NR1000
    - TX-NR5000
    name: 'off'
  '01':
    description: sets Speaker On
    models: &id001
    - DTM-7
    - DTR-10.5
    - DTR-5.2
    - ETX-NA1000
    - RDC-7.1
    - TX-8270(Ether)
    - TX-8390
    - TX-NA905
    - TX-NA906
    - TX-NA906X
    - TX-NR1000
    - TX-NR3007
    - TX-NR3008
    - TX-NR3009
    - TX-NR3010
    - TX-NR5000
    - TX-NR5007
    - TX-NR5008
    - TX-NR5009
    - TX-NR5010
    - TX-NR905
    - TX-NR906
    name: 'on'
  QSTN:
    description: gets the Speaker State
    models: *id001
    name: query
  UP:
    description: sets Speaker Switch Wrap-Around
    models: *id002
    name: up
