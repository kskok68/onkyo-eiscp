description: Screen Centered Dialog / Dialog Lifted Up
name: screen-centered-dialog-dialog-lifted-up
values:
  '00':
    description: sets Screen Centered Dialog Off
    models: &id001
    - DRC-R1
    - DRC-R1.1
    - DRC-R1.3
    - DRX-7
    - DRX-7.1
    - DRX-7.3
    - DRX-R1
    - DRX-R1.1
    - DRX-R1.3
    - PR-RZ5100
    - TX-RZ1100
    - TX-RZ3100
    - TX-RZ3400
    - TX-RZ920
    name: 'off'
  '01':
    description: sets Screen Centered Dialog On
    models: []
    name: 'on'
  ? - 2
    - 5
  : description: sets Screen Centered Dialog 1-4
    models: *id001
  UP:
    description: sets Screen Centered Dialog Wrap-Around
    models: *id001
    name: up
  QSTN:
    description: gets Screen Centered Dialog State
    models: *id001
    name: query
