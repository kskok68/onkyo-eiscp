description: Digital Filter
name: digital-filter
values:
  '00':
    description: sets Digital Filter Slow
    models: &id001
    - DRX-2.4
    - DRX-3.4
    - DRX-5.4
    - DRX-8.4
    - TX-NR5100
    - TX-NR6050
    - TX-NR6100
    - TX-NR7100
    - TX-RZ30
    - TX-RZ50
    - TX-RZ70
    name: slow
  '01':
    description: sets Digital Filter Sharp
    models: *id001
    name: sharp
  '02':
    description: sets Digital Filter Short
    models: *id001
    name: short
  '03':
    description: sets Digital Filter Auto
    models: *id001
    name: auto
  QSTN:
    description: gets The Digital Filter State
    models: *id001
    name: query
  UP:
    description: sets Digital Filter Wrap-Around
    models: *id001
    name: up
