description: Air Play Setting
name: air-play-setting
values:
  '00':
    description: sets Off
    models: &id001
    - DRX-2.4
    - DRX-3.4
    - DRX-5.4
    - TX-NR5100
    - TX-NR6050
    - TX-NR6100
    - TX-NR7100
    - TX-RZ50
    name: 'off'
  '01':
    description: sets On
    models: *id001
    name: 'on'
  QSTN:
    description: gets Air Play Setting
    models: *id001
    name: query
  UP:
    description: sets Air Play Setting Wrap-Around Up
    models: *id001
    name: up
