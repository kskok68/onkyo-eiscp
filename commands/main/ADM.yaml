description: AV Direct Mode Operation Command
name: av-direct-mode
values:
  '00':
    description: sets AV Direct Mode:Off
    models: &id001
    - DRC-R1.3
    - DRX-7.3
    - DRX-R1.3
    - TX-RZ3400
    name: 'off'
  '01':
    description: sets AV Direct Mode:On
    models: *id001
    name: 'on'
  QSTN:
    description: gets AV Direct Mode Status
    models: *id001
    name: query
  TG:
    description: sets AV Direct Mode Wrap-Around Up
    models: *id001
    name: toggle
