description: Dirac Slot Selection
name: dirac-slot-selection
values:
  A00:
    description: Dirac off (All selector)
    models: &id001
    - DRX-3.4
    - DRX-5.4
    - TX-NR7100
    - TX-RZ50
    name: a00
  A01:
    description: Dirac on and select slot1 (All selector)
    models: *id001
    name: a01
  A02:
    description: Dirac on and select slot2 (All selector)
    models: *id001
    name: a02
  A03:
    description: Dirac on and select slot3 (All selector)
    models: *id001
    name: a03
  C00:
    description: Dirac off (Current selector only)
    models: *id001
    name: c00
  C01:
    description: Dirac on and select slot1 (Current selector only)
    models: *id001
    name: c01
  C02:
    description: Dirac on and select slot2 (Current selector only)
    models: *id001
    name: c02
  C03:
    description: Dirac on and select slot3 (Current selector only)
    models: *id001
    name: c03
  QSTN:
    description: get the Dirac slot selection
    models: *id001
    name: query
  '{xx}x':
    description: "x: Slot status\n    0: No data exists\n    1 : Data exists\n   \
      \ 2: Currently selected\n\n(Each character corresponds to one slot, and if there\
      \ are 3 slots, it will be 3 characters)"
    models: *id001
    name: xx-x
