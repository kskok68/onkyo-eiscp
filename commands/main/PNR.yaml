description: Panorama for PLII Music
name: panorama-for-plii-music
values:
  '00':
    description: sets Panorama Off
    models: &id001
    - TX-NR474
    name: 'off'
  '01':
    description: sets Panorama On
    models: *id001
    name: 'on'
  QSTN:
    description: gets The Panorama State
    models: *id001
    name: query
  TG:
    description: sets Panorama Wrap-Around
    models: *id001
    name: toggle
