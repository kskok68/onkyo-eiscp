description: Personal Preset Command (My Input Command)
name: personal-preset
values:
  QSTN:
    description: gets the Personal Preset Setting
    models: &id001
    - DTM-7.4
    - TX-8390
    - TX-8470
    name: query
  RCLn:
    description: recalls Personal Preset n (n = Preset Number 1-4)
    models: *id001
    name: rcln
  STRn:
    description: stores Personal Preset n (n = Preset Number 1-4)
    models: *id001
    name: strn
  abcd:
    description: 'a: Personal Preset 1 setting not exist = 0 / exist = 1

      b: Personal Preset 2 setting not exist = 0 / exist = 1

      c: Personal Preset 3 setting not exist = 0 / exist = 1

      d: Personal Preset 4 setting not exist = 0 / exist = 1'
    models: *id001
    name: abcd
