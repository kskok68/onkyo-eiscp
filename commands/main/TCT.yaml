description: Tone(Center) Command
name: tone-center
values:
  BDOWN:
    description: sets Center Bass down(2 step)
    models: &id001
    - DHC-80.1
    - DHC-80.2
    - DHC-80.3
    - DTR-70.1
    - DTR-70.2
    - DTR-70.3
    - DTR-70.4
    - DTR-80.1
    - DTR-80.2
    - DTR-80.3
    - PR-SC5507
    - PR-SC5508
    - PR-SC5509
    - TX-NR1007
    - TX-NR1010
    - TX-NR3007
    - TX-NR3008
    - TX-NR3009
    - TX-NR3010
    - TX-NR5007
    - TX-NR5008
    - TX-NR5009
    - TX-NR5010
    name: bass-down
  BUP:
    description: sets Center Bass up(2 step)
    models: *id001
    name: bass-up
  B{xx}:
    description: Center Bass (xx is "-A"..."00"..."+A"[-10...0...+10 2 step]
    models: *id001
    name: b-xx
  QSTN:
    description: gets Center Tone ("BxxTxx")
    models: *id001
    name: query
  TDOWN:
    description: sets Center Treble down(2 step)
    models: *id001
    name: treble-down
  TUP:
    description: sets Center Treble up(2 step)
    models: *id001
    name: treble-up
  T{xx}:
    description: Center Treble (xx is "-A"..."00"..."+A"[-10...0...+10 2 step]
    models: *id001
    name: t-xx
