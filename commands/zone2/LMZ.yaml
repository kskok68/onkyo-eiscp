description: Listening Mode Command
name: listening-mode
values:
  '00':
    description: sets STEREO
    models: &id001
    - DTR-10.5
    - ETX-NA1000
    - RDC-7.1
    - TX-NR1000
    - TX-NR5000
    name: stereo
  '01':
    description: sets DIRECT
    models: *id001
    name: direct
  0F:
    description: sets MONO
    models: *id001
    name: mono
  '12':
    description: sets MULTIPLEX
    models: *id001
    name: multiplex
  '87':
    description: sets DVS(Pl2)
    models: *id001
    name: dvs
  '88':
    description: sets DVS(NEO6)
    models: *id001
    name: dvs
