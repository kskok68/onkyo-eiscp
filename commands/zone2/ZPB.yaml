description: Zone 2 A/B Command
name: zone-2-b
values:
  '00':
    description: sets Zone 2 A/B Off
    models: &id001
    - DRX-4
    - DRX-5
    - TX-NR757
    - TX-NR777
    - TX-RZ710
    - TX-RZ720
    - TX-RZ810
    - TX-RZ820
    name: 'off'
  '01':
    description: sets Zone 2 A/B On
    models: *id001
    name: 'on'
  QSTN:
    description: gets the Speaker State
    models: *id001
    name: query
