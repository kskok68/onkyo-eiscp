name: Generate commands and trigger onkyo2mqtt-py3 beta rebuild

on:
  push:
    branches:
      - beta
    paths:
      - 'eiscp-commands.yaml'

jobs:
  generate-and-trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate commands.py
        run: python generate_commands_module.py eiscp-commands.yaml > eiscp/commands.py

      - name: Commit updated commands.py
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add eiscp/commands.py
          git diff --staged --quiet || git commit -m "Auto-regenerate commands.py from eiscp-commands.yaml"
          git push

      - name: Trigger downstream build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.ONKYO2MQTT_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/kskok68/onkyo2mqtt-py3/actions/workflows/docker.yml/dispatches \
            -d '{"ref":"beta"}'
